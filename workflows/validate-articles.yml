name: Validate articles.json

on:
  pull_request:
    paths:
      - 'content/articles.json'
  push:
    branches:
      - main
    paths:
      - 'content/articles.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check JSON is well-formed
        run: python3 -m json.tool content/articles.json > /dev/null

      - name: Check required fields on every article
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('content/articles.json') as f:
              data = json.load(f)

          required = ['id', 'section', 'tier', 'headline', 'dek', 'body', 'author', 'ts']
          errors = []

          if 'articles' not in data:
              sys.exit('ERROR: articles.json is missing the top-level "articles" array.')

          ids_seen = set()
          for i, article in enumerate(data['articles']):
              label = article.get('id', f'index {i}')

              missing = [f for f in required if f not in article]
              if missing:
                  errors.append(f'Article "{label}": missing required field(s): {", ".join(missing)}')

              aid = article.get('id')
              if aid in ids_seen:
                  errors.append(f'Article "{label}": duplicate id "{aid}"')
              ids_seen.add(aid)

              if article.get('tier') not in (None, 'free', 'plus', 'pro'):
                  errors.append(f'Article "{label}": invalid tier "{article.get("tier")}"')

              # If a metrics block exists, sanity-check its shape rather than requiring one at all.
              metrics = article.get('metrics')
              if metrics is not None and not isinstance(metrics, dict):
                  errors.append(f'Article "{label}": "metrics" must be an object if present')

              # Stock Position Desk articles carry a required "position" block
              # with its own fields, since they drive the entry/target/stop
              # chart and the risk-tier / trading-style badges.
              if article.get('section') == 'stockposition':
                  position = article.get('position')
                  if not isinstance(position, dict):
                      errors.append(f'Article "{label}": section "stockposition" requires a "position" object')
                  else:
                      pos_required = ['ticker', 'company', 'tradingStyle', 'riskTier', 'holdingPeriod',
                                       'expectedReturnLow', 'expectedReturnHigh', 'entryPrice', 'targetPrice', 'stopLoss']
                      pos_missing = [f for f in pos_required if f not in position]
                      if pos_missing:
                          errors.append(f'Article "{label}": "position" missing required field(s): {", ".join(pos_missing)}')

                      valid_styles = ('core', 'income', 'swing', 'momentum', 'catalyst')
                      if 'tradingStyle' not in pos_missing and position.get('tradingStyle') not in valid_styles:
                          errors.append(f'Article "{label}": invalid "position.tradingStyle" "{position.get("tradingStyle")}"')

                      valid_risk_tiers = ('conservative', 'moderate', 'aggressive', 'speculative')
                      if 'riskTier' not in pos_missing and position.get('riskTier') not in valid_risk_tiers:
                          errors.append(f'Article "{label}": invalid "position.riskTier" "{position.get("riskTier")}"')

                      numeric_fields = ['expectedReturnLow', 'expectedReturnHigh', 'entryPrice', 'targetPrice', 'stopLoss']
                      for nf in numeric_fields:
                          if nf not in pos_missing and not isinstance(position.get(nf), (int, float)):
                              errors.append(f'Article "{label}": "position.{nf}" must be a number')

          if errors:
              print('articles.json failed validation:\n')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)

          print(f'OK: {len(data["articles"])} articles validated, no errors.')
          EOF

      - name: Report success
        if: success()
        run: echo "✅ content/articles.json is valid JSON with all required fields."
