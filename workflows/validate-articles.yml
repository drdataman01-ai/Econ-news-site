name: Validate articles.json

on:
  pull_request:
    paths:
      - 'content/articles.json'
  push:
    branches:
      - main
    paths:
      - 'content/articles.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check JSON is well-formed
        run: python3 -m json.tool content/articles.json > /dev/null

      - name: Check required fields on every article
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('content/articles.json') as f:
              data = json.load(f)

          required = ['id', 'section', 'tier', 'headline', 'dek', 'body', 'author', 'ts']
          errors = []

          if 'articles' not in data:
              sys.exit('ERROR: articles.json is missing the top-level "articles" array.')

          ids_seen = set()
          for i, article in enumerate(data['articles']):
              label = article.get('id', f'index {i}')

              missing = [f for f in required if f not in article]
              if missing:
                  errors.append(f'Article "{label}": missing required field(s): {", ".join(missing)}')

              aid = article.get('id')
              if aid in ids_seen:
                  errors.append(f'Article "{label}": duplicate id "{aid}"')
              ids_seen.add(aid)

              if article.get('tier') not in (None, 'free', 'plus', 'pro'):
                  errors.append(f'Article "{label}": invalid tier "{article.get("tier")}"')

              # If a metrics block exists, sanity-check its shape rather than requiring one at all.
              metrics = article.get('metrics')
              if metrics is not None and not isinstance(metrics, dict):
                  errors.append(f'Article "{label}": "metrics" must be an object if present')

              # Stock Position Desk articles are labeled with one of the five
              # position styles, the same simple tag pattern as theoryKey —
              # not a per-article trade panel (that data lives in the
              # top-level "rankings" object, checked separately below).
              valid_styles = ('core', 'income', 'swing', 'momentum', 'catalyst')
              if article.get('section') == 'stockposition':
                  if article.get('styleKey') not in valid_styles:
                      errors.append(f'Article "{label}": "styleKey" must be one of {", ".join(valid_styles)} for section "stockposition"')

              # Outlook posts on any of the five outlook desks (sp500,
              # japan, taiwan, sea, tech) can carry an "outlook" object
              # (rendered as the forecast line + color-strip chart by
              # renderOutlookChart in charts.js). Optional, but when
              # present all four horizons are required and must be one of
              # the ids in OUTLOOK_LEVELS (config.js).
              valid_outlook_levels = ('down', 'flat', 'slight_up', 'up')
              outlook_horizons = ('threeMonth', 'sixMonth', 'twelveMonth', 'twentyFourMonth')
              outlook_sections = ('sp500', 'japan', 'taiwan', 'sea', 'tech')
              outlook = article.get('outlook')
              if outlook is not None:
                  if article.get('section') not in outlook_sections:
                      errors.append(f'Article "{label}": "outlook" is only valid for sections {", ".join(outlook_sections)}')
                  if not isinstance(outlook, dict):
                      errors.append(f'Article "{label}": "outlook" must be an object if present')
                  else:
                      missing_horizons = [h for h in outlook_horizons if h not in outlook]
                      if missing_horizons:
                          errors.append(f'Article "{label}": "outlook" missing horizon(s): {", ".join(missing_horizons)}')
                      for h, level in outlook.items():
                          if h not in outlook_horizons:
                              errors.append(f'Article "{label}": "outlook.{h}" is not a recognized horizon')
                          elif level not in valid_outlook_levels:
                              errors.append(f'Article "{label}": "outlook.{h}" must be one of {", ".join(valid_outlook_levels)}')

          # Top-level "rankings" object (optional): the site owner's own
          # ranked picks per position style, shown as tables on the Stock
          # Position Desk page. When present, each of the five style keys
          # must map to an array of {rank, ticker, company} entries (note
          # is optional free text).
          rankings = data.get('rankings')
          if rankings is not None:
              if not isinstance(rankings, dict):
                  errors.append('"rankings" must be an object if present')
              else:
                  unknown_keys = [k for k in rankings.keys() if k not in valid_styles]
                  if unknown_keys:
                      errors.append(f'"rankings" has unrecognized style key(s): {", ".join(unknown_keys)}')
                  for style_key, rows in rankings.items():
                      if style_key not in valid_styles:
                          continue
                      if not isinstance(rows, list):
                          errors.append(f'"rankings.{style_key}" must be an array')
                          continue
                      for j, row in enumerate(rows):
                          row_label = f'rankings.{style_key}[{j}]'
                          if not isinstance(row, dict):
                              errors.append(f'"{row_label}" must be an object')
                              continue
                          row_required = ['rank', 'ticker', 'company']
                          row_missing = [f for f in row_required if f not in row]
                          if row_missing:
                              errors.append(f'"{row_label}" missing required field(s): {", ".join(row_missing)}')
                          if 'rank' in row and not isinstance(row.get('rank'), (int, float)):
                              errors.append(f'"{row_label}.rank" must be a number')

          if errors:
              print('articles.json failed validation:\n')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)

          print(f'OK: {len(data["articles"])} articles validated, no errors.')
          EOF

      - name: Report success
        if: success()
        run: echo "✅ content/articles.json is valid JSON with all required fields."
